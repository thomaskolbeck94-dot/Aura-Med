<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraMed | Zahlung Erfolgreich</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
      .success-container {
        max-width: 600px;
        margin: 100px auto;
        text-align: center;
        padding: 40px;
      }
      .api-key-box {
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 20px;
        margin: 30px 0;
        font-family: monospace;
        font-size: 1.2rem;
        color: #10b981;
        word-break: break-all;
        display: none;
      }
      .loader {
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top: 3px solid #10b981;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 30px auto;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="bg-glow blob-1"></div>
    <div class="bg-glow blob-2"></div>

    <nav class="navbar glass">
      <div class="nav-container">
        <div class="logo">
          <a href="/" style="text-decoration: none; color: inherit;">
            <span class="logo-icon">⚡</span>
            AuraMed
          </a>
        </div>
      </div>
    </nav>

    <div class="success-container glass">
      <h1 style="margin-bottom: 10px;">Zahlung Erfolgreich! 🎉</h1>
      <p style="color: #9ca3af;" id="status-text">Wir generieren Ihren persönlichen API-Key...</p>
      
      <div class="loader" id="loader"></div>
      
      <div class="api-key-box" id="api-key-box"></div>
      
      <button class="btn-primary" id="copy-btn" style="display: none; margin: 0 auto 20px;" onclick="copyKey()">API-Key kopieren</button>
      
      <a href="https://api.getauramed.de/docs" class="btn-secondary" id="docs-btn" style="display: none; margin: 0 auto;">Zur API-Dokumentation</a>
    </div>

    <script>
      async function retrieveKey() {
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        
        const loader = document.getElementById('loader');
        const statusText = document.getElementById('status-text');
        const keyBox = document.getElementById('api-key-box');
        const copyBtn = document.getElementById('copy-btn');
        const docsBtn = document.getElementById('docs-btn');

        if (!sessionId) {
          loader.style.display = 'none';
          statusText.innerHTML = '<span style="color: #ef4444;">Fehler: Keine Session ID gefunden.</span>';
          return;
        }

        try {
          // Wir versuchen es bis zu 5 Mal, falls der Stripe Webhook ein paar Sekunden braucht
          let attempts = 0;
          let data = null;
          
          while(attempts < 5) {
            const response = await fetch(`https://api.getauramed.de/api/v1/stripe/retrieve_key?session_id=${sessionId}`);
            
            if (response.ok) {
              data = await response.json();
              break;
            }
            
            // Warten und nochmal versuchen (Stripe Webhook Verzögerung)
            attempts++;
            await new Promise(r => setTimeout(r, 2000));
          }

          loader.style.display = 'none';

          if (data && data.success) {
            statusText.innerText = "Ihr AuraMed API-Key ist bereit. Bitte speichern Sie ihn sicher ab!";
            keyBox.innerText = data.api_key;
            keyBox.style.display = 'block';
            copyBtn.style.display = 'block';
            docsBtn.style.display = 'block';
          } else {
            statusText.innerHTML = '<span style="color: #ef4444;">Fehler beim Abrufen des Keys. Bitte kontaktieren Sie den Support.</span>';
          }
        } catch (error) {
          loader.style.display = 'none';
          statusText.innerHTML = '<span style="color: #ef4444;">Netzwerkfehler beim Abrufen des Keys.</span>';
        }
      }

      function copyKey() {
        const keyText = document.getElementById('api-key-box').innerText;
        navigator.clipboard.writeText(keyText).then(() => {
          const btn = document.getElementById('copy-btn');
          btn.innerText = "Kopiert! ✓";
          btn.style.background = "#059669";
          setTimeout(() => {
            btn.innerText = "API-Key kopieren";
            btn.style.background = "";
          }, 3000);
        });
      }

      // Start on load
      window.onload = retrieveKey;
    </script>
  </body>
</html>
